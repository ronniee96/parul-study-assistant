[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant"
version = "2.0.0"
description = "Parul University AI Study Assistant & Exam Predictor by Rohan Mitra"
authors = [
    { name = "Rohan Mitra", email = "rohanmitra@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "openai>=1.3.0",
    "anthropic>=0.7.8",
    "scikit-learn>=1.3.2",
    "numpy>=1.24.3",
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.3",
    "python-pptx>=0.6.23",
    "Pillow>=10.0.1",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "reportlab>=4.0.4",
    "nltk>=3.8.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[project.scripts]
study-assistant = "backend.main:start"
study-assistant-mcp = "backend.mcp_server:main"

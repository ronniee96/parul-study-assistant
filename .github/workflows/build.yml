name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c "from app.services.exam_predictor import ExamPredictor; print('ExamPredictor OK')"
      - run: python -c "from app.services.question_ranker import QuestionRanker; print('QuestionRanker OK')"
      - run: python -c "from app.services.answer_generator import AnswerGenerator; print('AnswerGenerator OK')"
      - run: python -c "from app.services.pdf_service import PDFService; print('PDFService OK')"
      - run: python -c "from app.models.schemas import QuestionItem, ExamPredictionRequest; print('Schemas OK')"
